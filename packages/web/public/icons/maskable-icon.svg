<!-- Maskable icon: safe zone is the central 80% (per W3C spec) so the
     core glyph survives Android's adaptive-icon cropping. Outer 10%
     padding can be safely clipped to any shape (circle, squircle, etc.).
     Composition mirrors icon.svg, scaled by 0.8 around the icon center. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Atlanta Transit">
  <rect width="512" height="512" fill="#0066CC"/>
  <rect x="70" y="125" width="371" height="230" rx="35" fill="#ffffff"/>
  <rect x="96" y="150" width="320" height="64" rx="11" fill="#0066CC"/>
  <text
    x="256"
    y="307"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="112"
    font-weight="800"
    text-anchor="middle"
    fill="#0066CC"
    letter-spacing="-4"
  >ATL</text>
  <circle cx="157" cy="355" r="42" fill="#0066CC"/>
  <circle cx="355" cy="355" r="42" fill="#0066CC"/>
  <circle cx="157" cy="355" r="32" fill="#ffffff"/>
  <circle cx="355" cy="355" r="32" fill="#ffffff"/>
  <circle cx="157" cy="355" r="11" fill="#0066CC"/>
  <circle cx="355" cy="355" r="11" fill="#0066CC"/>
</svg>
