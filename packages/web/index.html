<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0066CC" />
    <meta name="description" content="Real-time MARTA bus arrivals for metro Atlanta. Unofficial — not affiliated with MARTA." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>Atlanta Transit</title>
    <script>
      // Theme bootstrap — runs before React mounts to avoid flash-of-wrong-theme.
      // See docs/architecture.md "Theme system".
      (function () {
        var saved = localStorage.getItem('atl-transit:theme');
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var mode = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', mode === 'dark');
      })();
    </script>
  </head>
  <body class="bg-surface text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
