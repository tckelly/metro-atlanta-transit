packages:
  - 'packages/*'

# Native build-script allowlist. pnpm default-denies install scripts
# since v9 for supply-chain safety; this map explicitly approves the
# ones we trust. `pnpm approve-builds` writes here. `better-sqlite3`
# ships a native binding for SQLite — needed for the GTFS preprocessor
# and the backend stop-times function.
allowBuilds:
  better-sqlite3: true
